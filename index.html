const macroHits=(t,g)=>{
  const within=(v,goal)=>goal>0&&v>=goal*0.85&&v<=goal*1.15;
  let n=0;
  if(within(t.k,g.kcal))n++;if(within(t.p,g.protein))n++;if(within(t.c,g.carbs))n++;if(within(t.f,g.fat))n++;
  return n;
};

const daysBetween=(dateStr)=>{const d1=new Date(dateStr+'T00:00:00'),d2=new Date();d2.setHours(0,0,0,0);
  return Math.max(0,Math.round((d2-d1)/86400000));};
const weeksBetween=dateStr=>Math.floor(daysBetween(dateStr)/7);
const isWeekend=dateStr=>{const dow=new Date(dateStr+'T12:00:00').getDay();return dow===0||dow===6;};

/* Ritmo real (kg/semana) usando os registros dos últimos `days` dias */
const realWeeklyRate=(days)=>{
  const w=ls.g('wlog')||[];if(w.length<2)return null;
  const lim=offsetDate(days||28);
  const sub=w.filter(x=>x.date>=lim);
  const arr=sub.length>=2?sub:w.slice(-2);
  const a=arr[0],b=arr[arr.length-1];
  const dd=(new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/86400000;
  if(dd<3)return null;
  return f2(((b.kg-a.kg)/dd)*7);
};

/* ── REGISTRADO RECENTEMENTE ── */
const recentFoods=(days,limit)=>{
  const seen=new Map();
  for(let i=0;i<(days||21);i++){
    const d=ls.g(tkey(i));if(!d||!d.meals)continue;
    for(const m of d.meals){
      if(m.estimated||!m.items)continue;
      for(const it of m.items){
        if(!it||!it.food)continue;
        const key=norm(it.food)+'|'+it.qty+'|'+it.unit;
        if(!seen.has(key))seen.set(key,Object.assign({},it,{origem:m.name}));
      }
    }
  }
  return Array.from(seen.values()).slice(0,limit||30);
};
/* ── SUGESTÕES POR REFEIÇÃO — alimentos mais usados historicamente NESSA refeição
   específica (ex: o que você mais come no café da manhã), ordenado por frequência ── */
const mealSuggestions=(mealName,limit)=>{
  if(!mealName)return[];
  const agg=new Map();
  for(let i=0;i<60;i++){
    const d=ls.g(tkey(i));if(!d||!d.meals)continue;
    for(const m of d.meals){
      if(m.name!==mealName||m.estimated||!m.items)continue;
      for(const it of m.items){
        if(!it||!it.food)continue;
        const key=norm(it.food);
        if(agg.has(key))agg.get(key).count++;
        else agg.set(key,Object.assign({},it,{count:1}));
      }
    }
  }
  return Array.from(agg.values()).sort((a,b)=>b.count-a.count).slice(0,limit||8);
};

const matchScore=(name,words)=>{
  const fn=norm(name);
  let score=0;
  for(const w of words){if(fn.includes(w))score+=w.length>=4?2:1;} // palavras maiores pesam mais
  return score;
};
const searchLocal=q=>{
  if(!q||q.length<2)return[];
  const words=norm(q).split(/\s+/).filter(Boolean);
  const ALL_TACO=[...TACO,...TACO_EXTRA];
  const rank=list=>list.map(f=>({f,s:matchScore(f.n,words)})).filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s||a.f.n.length-b.f.n.length).map(x=>x.f);

};

async function searchOFF(q){
  try{
    const r=await fetch(`https://br.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&fields=product_name,brands,nutriments,serving_size&page_size=8`);
    const d=await r.json();
    return (d.products||[]).filter(p=>p.product_name&&p.nutriments&&(p.nutriments['energy-kcal_100g']||p.nutriments['energy_100g']))
      .map(p=>{const k=p.nutriments['energy-kcal_100g']||Math.round((p.nutriments['energy_100g']||0)/4.184);
        return{id:'off_'+p.product_name,n:p.product_name+(p.brands?' · '+p.brands:''),k:Math.round(k),
          p:f2(p.nutriments['proteins_100g']||0),c:f2(p.nutriments['carbohydrates_100g']||0),
          f:f2(p.nutriments['fat_100g']||0),note:p.serving_size||null,srcLabel:'OFF',srcCol:C.purple};
      }).filter(f=>f.k>0).slice(0,5);
  }catch{return [];}
}

function WChart({data,proj}){
  if(!data||data.length<2)return null;
  const allVals=[...data.map(w=>w.kg),...(proj||[]).map(p=>p.kg)];
  const mn=Math.min.apply(0,allVals)-0.8,mx=Math.max.apply(0,allVals)+0.8,W=300,H=72;
  const n=data.length,totalPts=n+(proj||[]).length;
  const sx=i=>(i/(totalPts-1))*W;
  const sy=v=>H-((v-mn)/(mx-mn))*(H-10)-5;
  const histPts=data.map((w,i)=>sx(i)+','+sy(w.kg)).join(' ');
  const lastX=sx(n-1),lastY=sy(data[n-1].kg);
  const projPts=proj?[`${lastX},${lastY}`,...proj.map((p,i)=>sx(n+i)+','+sy(p.kg))].join(' '):null;
  return html`<svg viewBox=${'0 0 '+W+' '+H} style=${{width:'100%',height:'72px',display:'block'}}>
    ${projPts&&html`<polyline points=${projPts} fill="none" stroke=${C.ok+'55'} stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>`}
    <polyline points=${histPts} fill="none" stroke=${C.accent+'77'} stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((w,i)=>html`<circle key=${i} cx=${sx(i)} cy=${sy(w.kg)} r=${i===n-1?4:2.5}
      fill=${i===n-1?C.accent:C.s1} stroke=${C.accent} stroke-width="1.5"/>`)}
    ${proj&&proj.length>0&&html`<circle cx=${sx(totalPts-1)} cy=${sy(proj[proj.length-1].kg)} r="3.5"
      fill="none" stroke=${C.ok} stroke-width="1.5" stroke-dasharray="2 2"/>`}
    <text x=${sx(n-1)} y=${sy(data[n-1].kg)-8} text-anchor="middle" font-size="9" fill=${C.accent} font-weight="700">${data[n-1].kg.toFixed(1)}kg</text>
    ${proj&&proj.length>0&&html`<text x=${sx(totalPts-1)} y=${sy(proj[proj.length-1].kg)-8} text-anchor="middle" font-size="8" fill=${C.ok}>${proj[proj.length-1].kg.toFixed(1)}kg</text>`}
  </svg>`;}

/* ── PROJEÇÃO DUPLA ── */
function Projecao({weights}){
  const [macroData,setMacroData]=useState({avg:0,days:0,avgProt:0,window:21});
  const [trainData,setTrainData]=useState({perWeek:0});

  // Regressão linear (tendência real) — calculada primeiro pois define a janela de análise dos macros
  const regression=useMemo(()=>{
    if(weights.length<2)return null;
    const ref=new Date(weights[0].date+'T12:00:00').getTime();
    const xs=weights.map(w=>(new Date(w.date+'T12:00:00').getTime()-ref)/86400000);
    const ys=weights.map(w=>w.kg),n=weights.length;
    const spanDays=xs[n-1]-xs[0];
    const xm=xs.reduce((a,b)=>a+b)/n,ym=ys.reduce((a,b)=>a+b)/n;
    const num=xs.reduce((a,x,i)=>a+(x-xm)*(ys[i]-ym),0);
    const den=xs.reduce((a,x)=>a+(x-xm)**2,0);
    const rawSlope=den>0?num/den:0;
    // Trava de sanidade: nenhum ganho/perda humano sustenta >1.5 kg/sem — evita que
    // ruído de água/horário em poucos registros vire uma reta absurda ao extrapolar
    const MAX_WEEKLY=1.5;
    const weeklyRate=f2(Math.max(-MAX_WEEKLY,Math.min(MAX_WEEKLY,rawSlope*7)));
    const slope=weeklyRate/7;
    // Só é confiável com pontos suficientes espalhados por tempo suficiente
    const MIN_POINTS=4,MIN_SPAN_DAYS=14;
    const reliable=n>=MIN_POINTS&&spanDays>=MIN_SPAN_DAYS;
    return{slope,lastKg:ys[n-1],weeklyRate,spanDays,points:n,reliable};
  },[weights]);

  useEffect(()=>{
    // Janela de análise dos macros alinhada ao período real das pesagens (14–45 dias)
    const WINDOW=Math.min(45,Math.max(14,Math.round(regression?regression.spanDays:21)));
    let totalK=0,totalP=0,count=0;
    for(let i=0;i<WINDOW;i++){
      const d=ls.g(tkey(i));
      if(d&&d.meals&&d.meals.length>0){
        const s=sumM(d.meals);totalK+=s.k;totalP+=s.p;count++;
      }
    }
    setMacroData({avg:count>0?Math.round(totalK/count):0,
      avgProt:count>0?Math.round(totalP/count):0,days:count,window:WINDOW});

    // Frequência de treino (últimas 4 semanas)
    let ci=0;const now=new Date();
    for(let i=0;i<4;i++){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const k=mkey(d.getFullYear(),d.getMonth());
      const v=ls.g('ci:'+k);ci+=(v&&v.days?v.days.length:0);
    }
    setTrainData({perWeek:f2(ci/4)});
  },[regression&&regression.spanDays]);

  // TDEE calibrado: usa o ritmo REAL da balança + a média REAL de kcal registrada no
  // mesmo período para resolver a manutenção calórica desta pessoa especificamente,
  // em vez de estimar com fórmulas genéricas (Harris-Benedict etc.)
  const calibrated=useMemo(()=>{
    if(!regression||!regression.reliable)return null;
    if(!macroData.avg||macroData.days<5)return null;
    // cobertura mínima: precisa de registros de comida em pelo menos ~35% dos dias da janela
    if(macroData.days<macroData.window*0.35)return null;
    const tdee=Math.round(macroData.avg-(regression.weeklyRate*7700/7));
    if(tdee<1000||tdee>6000)return null; // fora da faixa humana plausível → dado ruidoso demais
    const goals=ls.g('goals')||GOALS;
    const rateAtGoal=f2((goals.kcal-tdee)*7/7700);
    const lastKg=weights[weights.length-1].kg;
    return{tdee,rateAtGoal,
      proj4:f2(lastKg+rateAtGoal*4),proj8:f2(lastKg+rateAtGoal*8),proj12:f2(lastKg+rateAtGoal*12),
      adherencePct:goals.kcal>0?Math.round(macroData.avg/goals.kcal*100):null,
      coverage:macroData.days,window:macroData.window};
  },[regression,macroData,weights]);

  if(weights.length<2)return html`<div style=${{background:C.s1,borderRadius:'13px',padding:'14px',
    border:'1px solid '+C.border,textAlign:'center',color:C.muted,fontSize:'11px'}}>
    Registre pelo menos 2 pesagens para ativar a projeção</div>`;

  if(!regression.reliable)return html`<div style=${{background:C.s1,borderRadius:'13px',padding:'14px',
    border:'1px solid '+C.border,textAlign:'center',color:C.muted,fontSize:'11px'}}>
    Dados ainda insuficientes para uma tendência confiável (${regression.points} pesagem(ns) em ${Math.round(regression.spanDays)} dia(s)).
    <div style=${{color:C.dim,fontSize:'10px',marginTop:'6px'}}>Mínimo: 4 pesagens espalhadas em ≥14 dias.</div></div>`;

  const {lastKg,weeklyRate}=regression;
  const goals=ls.g('goals')||GOALS;

  // Pontos para o gráfico (histórico + 2 projeções)
  const projTrend=[4,8].map(w=>({kg:f2(lastKg+weeklyRate*w)}));
  const projMeta=calibrated?[4,8].map(w=>({kg:f2(lastKg+calibrated.rateAtGoal*w)})):null;

  // Diferença entre o ritmo real e o ritmo se batesse a meta de kcal (revela o quanto
  // a aderência à dieta está custando de progresso, calibrado ao seu próprio TDEE)
  const gap=calibrated?f2(calibrated.rateAtGoal-weeklyRate):null;

  // Insight principal — sempre ancorado no ritmo real e, quando possível, no TDEE calibrado
  const insight=(()=>{
    if(weights.length<3)return{txt:'Registre o peso semanalmente (mesmo dia/hora) para maior precisão.',col:C.muted};
    if(!calibrated){
      if(macroData.days<5)return{txt:'Registre as refeições por pelo menos 5 dias (na mesma janela das pesagens) para calcular seu gasto calórico real.',col:C.blue};
      return{txt:'Registros de peso e de refeições ainda não se sobrepõem o bastante para calcular um TDEE confiável — continue registrando os dois.',col:C.blue};
    }
    if(calibrated.adherencePct!==null&&calibrated.adherencePct<85&&gap!==null&&gap>0.15)
      return{txt:`Sua média é ${macroData.avg} kcal/dia (${calibrated.adherencePct}% da meta de ${goals.kcal}). Batendo a meta, o ritmo passaria de ${weeklyRate>=0?'+':''}${weeklyRate.toFixed(2)} para ~${calibrated.rateAtGoal>=0?'+':''}${calibrated.rateAtGoal.toFixed(2)} kg/sem.`,col:C.amber};
    if(weeklyRate>0.6)return{txt:`Ritmo de ganho alto (+${weeklyRate.toFixed(2)} kg/sem, TDEE calculado ~${calibrated.tdee} kcal). Para um bulk mais limpo, reduza ~${Math.round((weeklyRate-0.35)*7700/7)} kcal/dia.`,col:C.red};
    if(weeklyRate>=0.15)return{txt:`Progressão dentro do ideal (+${weeklyRate.toFixed(2)} kg/sem). Seu TDEE calculado é ~${calibrated.tdee} kcal — nesse ritmo você chega a ${f2(lastKg+weeklyRate*12).toFixed(1)} kg em 12 semanas.`,col:C.ok};
    if(weeklyRate>-0.05)return{txt:`Peso estável (TDEE calculado ~${calibrated.tdee} kcal). Suba ~${Math.round((0.3*7700)/7)} kcal/dia sobre esse valor para entrar em superávit de ganho.`,col:C.blue};
    return{txt:`Perda de peso detectada (${weeklyRate.toFixed(2)} kg/sem, TDEE calculado ~${calibrated.tdee} kcal). Aumente a ingestão calórica.`,col:C.red};
  })();

  return html`<div>
    ${/* Projeção em 4/8/12 semanas — dupla coluna */null}
    <div style=${{background:C.s1,borderRadius:'13px',padding:'14px',border:'1px solid '+C.border,marginBottom:'10px'}}>
      <div style=${{fontSize:'9px',color:C.muted,letterSpacing:'2px',textTransform:'uppercase',marginBottom:'12px',
        display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>Projeção</span>
        <div style=${{display:'flex',gap:'10px',fontSize:'9px'}}>
          <span style=${{display:'flex',alignItems:'center',gap:'4px'}}>
            <svg width="14" height="4"><line x1="0" y1="2" x2="14" y2="2" stroke=${C.accent} stroke-width="1.5"/></svg>Real
          </span>
          ${calibrated&&html`<span style=${{display:'flex',alignItems:'center',gap:'4px'}}>
            <svg width="14" height="4"><line x1="0" y1="2" x2="14" y2="2" stroke=${C.ok} stroke-width="1.5" stroke-dasharray="3 2"/></svg>Na meta
          </span>`}
        </div>
      </div>

      <div style=${{display:'flex',marginBottom:'12px'}}>
        ${[['4 sem',4],[' 8 sem',8],['12 sem',12]].map((s,i)=>html`<div key=${i} style=${{flex:1,textAlign:'center',
          borderRight:i<2?'1px solid '+C.border:'none',padding:'0 6px'}}>
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',marginBottom:'4px'}}>${s[0]}</div>
          <div style=${{fontSize:'14px',fontWeight:900,color:i===2?C.accent:C.text}}>
            ${f2(lastKg+weeklyRate*s[1]).toFixed(1)}kg</div>
          <div style=${{fontSize:'8px',color:weeklyRate>=0?C.ok:C.red,fontWeight:700}}>
            ${(weeklyRate*s[1]>=0?'+':'')+f2(weeklyRate*s[1]).toFixed(2)}kg</div>
          ${calibrated&&html`<div style=${{fontSize:'8px',color:C.ok+'99',marginTop:'2px'}}>
            ${(calibrated.rateAtGoal*s[1]>=0?'+':'')+f2(calibrated.rateAtGoal*s[1]).toFixed(2)} na meta
          </div>`}
        </div>`)}
      </div>

      <${WChart} data=${weights.slice(-8)} proj=${projTrend}/>
    </div>

    ${/* Indicadores ── 2×2 grid */null}
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}}>
      <div style=${{background:C.s1,borderRadius:'10px',padding:'10px 11px',border:'1px solid '+C.border}}>
        <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',textTransform:'uppercase',marginBottom:'4px'}}>Ritmo real</div>
        <div style=${{fontSize:'15px',fontWeight:900,color:weeklyRate>=0.15&&weeklyRate<=0.5?C.ok:weeklyRate>0.5?C.red:C.muted}}>
          ${weeklyRate>=0?'+':''}${weeklyRate.toFixed(2)} kg/sem</div>
        <div style=${{fontSize:'9px',color:C.dim}}>ideal: +0.15 a +0.50</div>
      </div>
      <div style=${{background:C.s1,borderRadius:'10px',padding:'10px 11px',border:'1px solid '+C.border}}>
        <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',textTransform:'uppercase',marginBottom:'4px'}}>TDEE calculado</div>
        ${calibrated?html`<div style=${{fontSize:'15px',fontWeight:900,color:C.ok}}>~${calibrated.tdee} kcal</div>
          <div style=${{fontSize:'9px',color:C.dim}}>peso real + ${calibrated.coverage} registro(s)</div>`
        :html`<div style=${{fontSize:'11px',color:C.dim,marginTop:'4px'}}>Registre macros ≥5 dias</div>`}
      </div>
      <div style=${{background:C.s1,borderRadius:'10px',padding:'10px 11px',border:'1px solid '+C.border}}>
        <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',textTransform:'uppercase',marginBottom:'4px'}}>Aderência à meta</div>
        ${calibrated&&calibrated.adherencePct!==null?html`<div style=${{fontSize:'15px',fontWeight:900,
            color:calibrated.adherencePct>=90?C.ok:calibrated.adherencePct>=75?C.amber:C.red}}>
            ${calibrated.adherencePct}%</div>
          <div style=${{fontSize:'9px',color:C.dim}}>média ${macroData.avg} de ${goals.kcal} kcal</div>`
        :html`<div style=${{fontSize:'11px',color:C.dim,marginTop:'4px'}}>Dados insuficientes</div>`}

      <div style=${{background:C.s1,borderRadius:'10px',padding:'10px 11px',border:'1px solid '+C.border}}>

        ${calibrated?html`<div style=${{fontSize:'15px',fontWeight:900,color:C.ok}}>

      </div>
    </div>

    ${/* Insight */null}

      <strong style=${{color:C.muted}}>TDEE calculado</strong> — sua manutenção calórica real, resolvida a partir do seu ritmo de balança e da sua média de kcal registrada no mesmo período (não é uma fórmula genérica). 
      <strong style=${{color:C.muted}}>Se bater a meta</strong> — o que aconteceria se você comesse os ${goals.kcal} kcal da meta todo dia, dado esse TDEE. Treinos/semana atuais: ${trainData.perWeek.toFixed(1)}×.
    </div>
  </div>`;
}

/* ── TAB TREINO ── */
function Treino(){
  const [open,setOpen]=useState(null);
  const [editDay,setEditDay]=useState(null);
  const [exercises,setExercises]=useState(()=>ls.g('exercises')||{});
  const [progStart,setProgStart]=useState(()=>{
    let s=ls.g('programStart');
    if(!s){s=today();ls.s('programStart',s);}
    return s;
  });
  const [progVersion,setProgVersion]=useState(()=>ls.g('programVersion')||1);
  const [showEvolve,setShowEvolve]=useState(false);
  const getEx=day=>exercises[day]||WD_DEFAULT.find(d=>d.n===day).ex;

  const saveEx=(dayN,exList)=>{
    const next=Object.assign({},exercises,{[dayN]:exList});
    setExercises(next);ls.s('exercises',next);setEditDay(null);
  };
  const resetEx=dayN=>{
    const next=Object.assign({},exercises);delete next[dayN];
    setExercises(next);ls.s('exercises',next);setEditDay(null);
  };
  const restartCount=()=>{const d=today();ls.s('programStart',d);setProgStart(d);};
  const applyEvolution=newPlan=>{
    const next={...exercises};
    newPlan.forEach(d=>{if(d&&d.n&&Array.isArray(d.ex)&&d.ex.length)next[d.n]=d.ex;});
    setExercises(next);ls.s('exercises',next);
    const d=today();ls.s('programStart',d);setProgStart(d);
    const v=progVersion+1;ls.s('programVersion',v);setProgVersion(v);
    setShowEvolve(false);
  };

  const wks=weeksBetween(progStart);
  const thresh=ls.g('evolveWeeks')||6;
  const dueForUpdate=wks>=thresh;

  return html`<div style=${{padding:'0 14px 20px'}}>
    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',
      background:dueForUpdate?C.amber+'14':C.s1,border:'1px solid '+(dueForUpdate?C.amber+'55':C.border),
      borderRadius:'11px',padding:'10px 12px',marginBottom:'10px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:'8px',minWidth:0}}>
        <${Ic} n=${dueForUpdate?'bell':'clock'} size=${15} col=${dueForUpdate?C.amber:C.muted}/>
        <div style=${{minWidth:0}}>
          <div style=${{fontSize:'11px',fontWeight:700,color:dueForUpdate?C.amber:C.text}}>
            ${dueForUpdate?'Hora de evoluir o treino!':'Neste treino há '+wks+' semana'+(wks!==1?'s':'')}
          </div>
          <div style=${{fontSize:'9px',color:C.dim}}>
            ${dueForUpdate?wks+' semanas no programa v'+progVersion+' — considere trocar estímulos':'Programa v'+progVersion+' · aviso em '+thresh+' semanas'}
          </div>
        </div>
      </div>
      <button onClick=${restartCount} title="Reiniciar contagem" style=${{background:'none',border:'none',
        color:C.dim,cursor:'pointer',padding:'4px',flexShrink:0}}>
        <${Ic} n="reset" size=${14} col=${C.dim}/>
      </button>
    </div>

    <button onClick=${()=>setShowEvolve(true)} style=${{width:'100%',display:'flex',alignItems:'center',
      justifyContent:'center',gap:'7px',padding:'10px',marginBottom:'12px',
      background:dueForUpdate?C.amber:C.s1,border:'1px solid '+(dueForUpdate?C.amber:C.border),
      borderRadius:'10px',color:dueForUpdate?'#000':C.text,fontSize:'11px',fontWeight:800,
      letterSpacing:'.5px',cursor:'pointer'}}>
      <${Ic} n="bolt" size=${14} col=${dueForUpdate?'#000':C.accent}/>EVOLUIR TREINO
    </button>

    ${WD_DEFAULT.map(day=>{
      const o=open===day.n,isEditing=editDay===day.n;
      const exList=getEx(day.n);
      const isCustom=!!exercises[day.n];
      return html`<div key=${day.n} style=${{borderRadius:'12px',background:o?day.dim:C.s1,
        border:'1px solid '+(o?day.col+'55':C.border),borderLeft:'4px solid '+day.col,
        overflow:'hidden',marginBottom:'8px',transition:'background .2s'}}>
        <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 14px',cursor:'pointer',userSelect:'none'}}
          onClick=${()=>{setOpen(o?null:day.n);setEditDay(null);}}>
          <div style=${{display:'flex',alignItems:'center',gap:'11px'}}>
            <span style=${{fontSize:'28px',fontWeight:900,color:o?day.col:C.border,lineHeight:1,
              minWidth:'34px',letterSpacing:'-2px',transition:'color .2s'}}>${pad(day.n)}</span>
            <div>
              <span style=${{fontSize:'8px',fontWeight:700,letterSpacing:'2.5px',color:TAGC[day.tag],textTransform:'uppercase',display:'block',marginBottom:'2px'}}>${day.tag}</span>
              <span style=${{fontSize:'12px',fontWeight:700}}>${day.title}</span>
              ${isCustom&&html`<span style=${{fontSize:'8px',color:day.col,marginLeft:'5px',opacity:.7}}>editado</span>`}
            </div>
          </div>
          <span style=${{color:C.muted,fontSize:'10px',display:'flex',alignItems:'center',gap:'5px'}}>
            ${exList.length} ex
            <span style=${{transform:o?'rotate(180deg)':'rotate(0)',transition:'transform .2s',display:'inline-block'}}>▾</span>
          </span>
        </div>

        ${o&&!isEditing&&html`<div style=${{padding:'0 14px 12px'}}>
          <div style=${{height:'1px',background:day.col+'25',marginBottom:'10px'}}/>
          ${exList.map((ex,i)=>html`<div key=${i} style=${{display:'flex',justifyContent:'space-between',
            alignItems:'flex-start',gap:'8px',marginBottom:'7px'}}>
            <div style=${{display:'flex',gap:'6px',flex:1,alignItems:'flex-start'}}>
              <span style=${{color:day.col,fontSize:'5px',paddingTop:'5px',flexShrink:0}}>●</span>
              <div>
                <span style=${{fontSize:'12px',color:'#CDD5DF',lineHeight:'1.3'}}>${ex.n}</span>

              <span style=${{fontSize:'10px',fontWeight:700,color:day.col,background:day.dim,padding:'2px 7px',borderRadius:'5px',whiteSpace:'nowrap'}}>${ex.d}</span>
              <a href=${'https://www.youtube.com/results?search_query='+encodeURIComponent(ex.n+' exercise')}
                target="_blank" rel="noopener"
                onClick=${e=>e.stopPropagation()}
                style=${{color:C.dim,display:'flex',alignItems:'center'}}>
                <${Ic} n="link" size=${12} col=${C.dim}/>
              </a>
            </div>
          </div>`)}
          <div style=${{marginTop:'10px',background:C.bg,borderRadius:'6px',padding:'8px 10px',borderLeft:'2px solid '+day.col+'30',marginBottom:'10px'}}>
            ${day.rest.map((r,i)=>html`<div key=${i} style=${{fontSize:'10px',color:C.muted,lineHeight:'1.9',display:'flex',alignItems:'center',gap:'5px'}}>
              <${Ic} n="clock" size=${10} col=${C.dim}/>${r}</div>`)}
          </div>
          <button onClick=${e=>{e.stopPropagation();setEditDay(day.n);}} style=${{
            display:'flex',alignItems:'center',gap:'6px',background:'none',
            border:'1px solid '+C.border,borderRadius:'7px',padding:'6px 10px',
            color:C.muted,fontSize:'10px',cursor:'pointer',fontWeight:600}}>
            <${Ic} n="pencil" size=${12} col=${C.muted}/>Editar exercícios
          </button>
        </div>`}

        ${o&&isEditing&&html`<${EditExercises} day=${day} exList=${exList} isCustom=${isCustom}
          onSave=${(list)=>saveEx(day.n,list)} onReset=${()=>resetEx(day.n)} onCancel=${()=>setEditDay(null)}/>`}
      </div>`;
    })}
    ${showEvolve&&html`<${EvolveTreino} current=${WD_DEFAULT.map(d=>({n:d.n,title:d.title,tag:d.tag,ex:getEx(d.n)}))}
      onApply=${applyEvolution} onClose=${()=>setShowEvolve(false)}/>`}
  </div>`;}

/* ── EVOLVE TREINO (IA) ── */
function EvolveTreino({current,onApply,onClose}){
  const [status,setStatus]=useState('idle'); // idle | loading | done | error
  const [plan,setPlan]=useState(null);
  const [errMsg,setErrMsg]=useState('');
  const [checked,setChecked]=useState({});
  const ak=localStorage.getItem('ak');

  const generate=async()=>{
    if(!ak){setStatus('error');setErrMsg('Configure a API key da Anthropic nas Configurações.');return;}
    setStatus('loading');
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,
          system:'Você é um personal trainer especialista em hipertrofia. Você recebe um programa de treino atual em JSON (dias com número, título, tag e lista de exercícios) e deve EVOLUIR o treino para quebrar a adaptação, mantendo a mesma quantidade de dias, os mesmos números de dia e os mesmos grupos musculares/tags de cada dia. Regras: (1) troque cerca de 30–50% dos exercícios por variações que estimulem os mesmos grupos de forma diferente (ex: trocar barra por halteres, pegada, ângulo, incluir técnicas de intensidade como superséries); (2) para os exercícios mantidos, evolua levemente a faixa de repetições ou observação indicando progressão; (3) preserve nomes de exercícios em português do Brasil; (4) responda SOMENTE com um JSON válido, sem texto extra, no formato: [{"n":1,"ex":[{"n":"nome do exercício","d":"4×8–10","note":"opcional, curto","ss":true}]}], um objeto por dia na mesma ordem recebida, apenas com os campos n e ex (note e ss são opcionais).',
          messages:[{role:'user',content:[{type:'text',text:'Programa atual:\n'+JSON.stringify(current)+'\n\nGere a versão evoluída deste programa, seguindo as regras.'}]}]})});
      const data=await resp.json();
      if(data.error)throw new Error(data.error.message||'Erro na API');
      const txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
      const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
      setPlan(parsed);
      setChecked(Object.fromEntries(parsed.map(d=>[d.n,true])));
      setStatus('done');
    }catch(e){setStatus('error');setErrMsg(e.message||'Falha ao gerar evolução');}
  };

  const apply=()=>{
    const toApply=plan.filter(d=>checked[d.n]);
    onApply(toApply);
  };

  return html`<div style=${{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:100,
    display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
    <div style=${{background:C.bg,borderRadius:'18px 18px 0 0',padding:'16px 15px 52px',maxHeight:'92vh',overflowY:'auto'}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
        <span style=${{fontSize:'13px',fontWeight:800,display:'flex',alignItems:'center',gap:'7px'}}>
          <${Ic} n="bolt" size=${15} col=${C.accent}/>Evoluir Treino</span>
        <button onClick=${onClose} style=${{background:'none',border:'none',color:C.muted,fontSize:'20px',cursor:'pointer',lineHeight:1}}>×</button>
      </div>

      ${status==='idle'&&html`<div>
        <div style=${{fontSize:'11px',color:C.muted,lineHeight:'1.6',marginBottom:'14px'}}>
          A IA vai analisar seu programa atual e sugerir uma nova versão: mantém a mesma estrutura de dias e grupos musculares,
          mas troca parte dos exercícios e ajusta repetições para evitar adaptação e continuar progredindo.
        </div>
        <button onClick=${generate} style=${{width:'100%',padding:'12px',background:C.accent,border:'none',
          borderRadius:'9px',color:'#fff',fontSize:'12px',fontWeight:900,cursor:'pointer',letterSpacing:'.5px'}}>
          GERAR EVOLUÇÃO</button>
      </div>`}

      ${status==='loading'&&html`<div style=${{textAlign:'center',padding:'30px 0'}}>
        <${Ic} n="bolt" size=${28} col=${C.accent} style=${{marginBottom:'10px'}}/>
        <div style=${{fontSize:'12px',color:C.muted}}>Montando a evolução do seu treino...</div>
      </div>`}

      ${status==='error'&&html`<div>
        <div style=${{fontSize:'11px',color:C.red,background:C.red+'14',borderRadius:'8px',padding:'10px 12px',marginBottom:'12px'}}>${errMsg}</div>
        <button onClick=${generate} style=${{width:'100%',padding:'11px',background:C.s1,border:'1px solid '+C.border,
          borderRadius:'8px',color:C.text,fontSize:'11px',fontWeight:700,cursor:'pointer'}}>Tentar novamente</button>
      </div>`}

      ${status==='done'&&plan&&html`<div>
        <div style=${{fontSize:'10px',color:C.muted,marginBottom:'12px',lineHeight:'1.5'}}>
          Revise dia a dia. Desmarque os dias que você quer manter como estão — só os marcados serão substituídos.
        </div>
        ${plan.map(d=>{
          const dayInfo=WD_DEFAULT.find(w=>w.n===d.n);
          const oldEx=current.find(c=>c.n===d.n)?.ex||[];
          const on=!!checked[d.n];
          return html`<div key=${d.n} style=${{background:C.s1,borderRadius:'10px',padding:'11px',marginBottom:'8px',
            border:'1px solid '+(on?(dayInfo?.col||C.accent)+'55':C.border),opacity:on?1:0.55}}>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
              <span style=${{fontSize:'11px',fontWeight:800}}>Dia ${d.n} — ${dayInfo?.title||''}</span>
              <label style=${{display:'flex',alignItems:'center',gap:'5px',fontSize:'9px',color:C.muted,cursor:'pointer'}}>
                <input type="checkbox" checked=${on} onChange=${e=>setChecked(p=>({...p,[d.n]:e.target.checked}))}/>
                aplicar
              </label>
            </div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
              <div>
                <div style=${{fontSize:'8px',color:C.dim,letterSpacing:'1px',textTransform:'uppercase',marginBottom:'4px'}}>Antes</div>
                ${oldEx.map((ex,i)=>html`<div key=${i} style=${{fontSize:'9px',color:C.dim,marginBottom:'3px',lineHeight:'1.3'}}>${ex.n}</div>`)}
              </div>
              <div>
                <div style=${{fontSize:'8px',color:dayInfo?.col||C.accent,letterSpacing:'1px',textTransform:'uppercase',marginBottom:'4px'}}>Novo</div>
                ${(d.ex||[]).map((ex,i)=>html`<div key=${i} style=${{fontSize:'9px',color:'#CDD5DF',marginBottom:'3px',lineHeight:'1.3'}}>
                  ${ex.n} <span style=${{color:dayInfo?.col||C.accent}}>${ex.d}</span></div>`)}
              </div>
            </div>
          </div>`;
        })}
        <div style=${{display:'flex',gap:'8px',marginTop:'6px'}}>
          <button onClick=${onClose} style=${{flex:1,padding:'11px',background:'none',border:'1px solid '+C.border,
            borderRadius:'9px',color:C.muted,fontSize:'11px',cursor:'pointer'}}>Cancelar</button>
          <button onClick=${apply} style=${{flex:2,padding:'11px',background:C.ok,border:'none',

/* ── TAB CHECKIN ── */
function Checkin(){
  const [ci,setCi]=useState({});
  const [view,setView]=useState({y:new Date().getFullYear(),m:new Date().getMonth()});
  const [burst,setBurst]=useState(false);
  const [pickDay,setPickDay]=useState(null);
  const now=new Date(),tK=mkey(now.getFullYear(),now.getMonth()),tD=now.getDate();

  const getCur=k=>ci[k]||{days:[],workouts:{}};

  useEffect(()=>{
    const d={};const n=new Date();
    for(let i=0;i<6;i++){const x=new Date(n.getFullYear(),n.getMonth()-i,1);
      const k=mkey(x.getFullYear(),x.getMonth());const v=ls.g('ci:'+k);
      d[k]=v?{days:v.days||[],workouts:v.workouts||{}}:{days:[],workouts:{}};}
    setCi(d);
  },[]);
  useEffect(()=>{const k=mkey(view.y,view.m);
    if(ci[k]===undefined){const v=ls.g('ci:'+k);
      setCi(p=>({...p,[k]:v?{days:v.days||[],workouts:v.workouts||{}}:{days:[],workouts:{}}}));}
  },[view.y,view.m]);

  const confirmCheckin=(k,d,wkDay)=>{
    const cur=getCur(k);
    const days=[...new Set([...cur.days,d])].sort((a,b)=>a-b);
    const workouts={...cur.workouts,[d]:wkDay};
    const next={...ci,[k]:{days,workouts}};
    setCi(next);ls.s('ci:'+k,{days,workouts});
    if(k===tK&&d===tD){setBurst(true);setTimeout(()=>setBurst(false),2500);}
    setPickDay(null);
  };
  const removeDay=(k,d)=>{
    const cur=getCur(k),days=cur.days.filter(x=>x!==d),workouts={...cur.workouts};
    delete workouts[d];
    setCi(p=>({...p,[k]:{days,workouts}}));ls.s('ci:'+k,{days,workouts});
  };
  const toggleDay=(k,d,isFuture)=>{
    if(isFuture)return;
    const cur=getCur(k);
    if(cur.days.indexOf(d)>=0){removeDay(k,d);}else{setPickDay({k,d});}
  };

  const metaWk=getMetas().workoutsWeek||5;
  const weekCount=useMemo(()=>{
    const n=new Date(),dow=(n.getDay()+6)%7;let c=0;
    for(let i=0;i<=dow;i++){
      const d=new Date();d.setDate(n.getDate()-dow+i);
      const kk=mkey(d.getFullYear(),d.getMonth());
      const v=ci[kk]||ls.g('ci:'+kk);
      if(v&&v.days&&v.days.indexOf(d.getDate())>=0)c++;
    }
    return c;},[ci]);
  const checked=getCur(tK).days.indexOf(tD)>=0;
  const streak=useMemo(()=>{let s=0,d=new Date();if(!checked)d.setDate(d.getDate()-1);
    for(let i=0;i<365;i++){const k=mkey(d.getFullYear(),d.getMonth());
      if(getCur(k).days.indexOf(d.getDate())>=0){s++;d.setDate(d.getDate()-1);}else break;}return s;},[ci,checked]);

  const vmK=mkey(view.y,view.m),pmD=new Date(view.y,view.m-1,1),pmK=mkey(pmD.getFullYear(),pmD.getMonth());
  const vmCur=getCur(vmK),vmCt=vmCur.days.length,pmCt=getCur(pmK).days.length,diff=vmCt-pmCt;
  const diffP=pmCt>0?Math.round((diff/pmCt)*100):null;
  const isNow=view.y===now.getFullYear()&&view.m===now.getMonth();
  const dim=new Date(view.y,view.m+1,0).getDate();
  const fwd=(()=>{const d=new Date(view.y,view.m,1).getDay();return d===0?6:d-1;})();
  const vmD=vmCur.days,vmW=vmCur.workouts||{};

  return html`<div style=${{padding:'0 14px 20px'}}>
    <div style=${{background:C.s1,borderRadius:'14px',padding:'18px',marginBottom:'10px',
      border:'1px solid '+(checked?C.accent+'44':C.border),textAlign:'center'}}>
      ${burst?html`<div style=${{padding:'8px 0'}}>
        <${Ic} n="bolt" size=${44} col=${C.accent} style=${{marginBottom:'8px'}}/>
        <div style=${{fontSize:'14px',fontWeight:900,color:C.accent}}>Check-in feito!</div>
      </div>`
      :checked?html`<div style=${{padding:'6px 0'}}>
        <${Ic} n="check" size=${42} col=${C.ok} style=${{marginBottom:'8px'}}/>
        <div style=${{fontSize:'12px',fontWeight:700,color:C.ok}}>Academia registrada hoje</div>
      </div>`
      :html`<div>
        <div style=${{fontSize:'10px',color:C.muted,marginBottom:'12px',letterSpacing:'1px',textTransform:'uppercase'}}>
          ${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>
        <button onClick=${()=>toggleDay(tK,tD,false)} style=${{background:C.accent,border:'none',borderRadius:'10px',
          padding:'11px 28px',color:'#fff',fontSize:'12px',fontWeight:900,cursor:'pointer',letterSpacing:'1px',
          boxShadow:'0 0 20px '+C.accent+'44',display:'inline-flex',alignItems:'center',gap:'8px'}}>
          <${Ic} n="dumbbell" size=${16} col="#fff"/>CHECK-IN HOJE</button>
      </div>`}
      <div style=${{marginTop:'14px',display:'flex',justifyContent:'center',gap:'18px'}}>
        ${streak>0&&html`<div style=${{textAlign:'center'}}>
          <div style=${{fontSize:'20px',fontWeight:900,color:C.accent}}>${streak}</div>
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px'}}>DIA${streak>1?'S':''} SEGUIDO${streak>1?'S':''}</div>
        </div>`}
        ${streak>0&&html`<div style=${{width:'1px',background:C.border}}/>`}
        <div style=${{textAlign:'center'}}>
          <div style=${{fontSize:'20px',fontWeight:900,color:weekCount>=metaWk?C.ok:C.text}}>
            ${weekCount}<span style=${{fontSize:'12px',color:C.muted,fontWeight:700}}>/${metaWk}</span></div>
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px'}}>ESTA SEMANA</div>
        </div>
        <div style=${{width:'1px',background:C.border}}/>
        <div style=${{textAlign:'center'}}>
          <div style=${{fontSize:'20px',fontWeight:900}}>${vmCt}</div>
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px'}}>ESTE MÊS</div>
        </div>
      </div>
    </div>

    <div style=${{background:C.s1,borderRadius:'14px',padding:'13px',marginBottom:'10px',border:'1px solid '+C.border}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
        <button onClick=${()=>setView(v=>{const d=new Date(v.y,v.m-1,1);return{y:d.getFullYear(),m:d.getMonth()};})}
          style=${{background:'none',border:'1px solid '+C.border,borderRadius:'7px',color:C.muted,
            padding:'5px 11px',cursor:'pointer',fontSize:'15px',lineHeight:1}}>‹</button>
        <div style=${{textAlign:'center'}}>
          <div style=${{fontSize:'12px',fontWeight:700,textTransform:'capitalize'}}>${ptMonth(view.y,view.m)}</div>
          <div style=${{fontSize:'10px',marginTop:'2px',color:diff>0?C.ok:diff<0?C.red:C.muted}}>
            ${vmCt} visita${vmCt!==1?'s':''}${diffP!==null?' ('+(diff>0?'+':'')+diff+' vs anterior)':''}</div>
        </div>
        <button onClick=${()=>{if(!isNow)setView(v=>{const d=new Date(v.y,v.m+1,1);return{y:d.getFullYear(),m:d.getMonth()};});}}
          style=${{background:'none',border:'1px solid '+C.border,borderRadius:'7px',
            color:isNow?C.dim:C.muted,padding:'5px 11px',cursor:isNow?'default':'pointer',fontSize:'15px',lineHeight:1}}>›</button>
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:'4px'}}>
        ${'STQQSSD'.split('').map((d,i)=>html`<div key=${i} style=${{textAlign:'center',fontSize:'8px',color:C.dim,fontWeight:700,padding:'2px 0'}}>${d}</div>`)}
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px'}}>
        ${Array.from({length:fwd}).map((_,i)=>html`<div key=${'e'+i}/>`)}
        ${Array.from({length:dim}).map((_,i)=>{
          const d=i+1,ck=vmD.indexOf(d)>=0,wk=vmW[d];
          const isT=isNow&&d===tD,isFu=isNow&&d>tD;
          return html`<div key=${d} onClick=${()=>toggleDay(vmK,d,isFu)}
            style=${{aspectRatio:'1',display:'flex',flexDirection:'column',alignItems:'center',
              justifyContent:'center',borderRadius:'50%',fontSize:'10px',fontWeight:ck||isT?700:400,
              cursor:isFu?'default':'pointer',
              background:ck?WD_DEFAULT.find(w=>w.n===wk)?.col||C.accent:isT?C.accent+'22':'transparent',
              color:ck?'#fff':isT?C.accent:isFu?C.dim:C.text,
              border:isT&&!ck?'1px solid '+C.accent:'none',
              transition:'background .15s',position:'relative'}}>
            ${d}
            ${ck&&wk&&html`<span style=${{fontSize:'7px',fontWeight:900,lineHeight:1,opacity:.9}}>D${wk}</span>`}
          </div>`;
        })}
      </div>
      <div style=${{marginTop:'8px',fontSize:'9px',color:C.dim,textAlign:'center'}}>Toque em qualquer dia para registrar ou remover</div>
    </div>

    ${pmCt>0&&html`<div style=${{background:C.s1,borderRadius:'14px',padding:'13px',border:'1px solid '+C.border,display:'flex'}}>
      ${[['Mês anterior',pmCt,C.muted],['Este mês',vmCt,C.accent],
        ['Variação',diff===0?'=':(diff>0?'+':'')+diff,diff>0?C.ok:diff<0?C.red:C.muted]].map((s,i)=>
        html`<div key=${i} style=${{flex:1,textAlign:'center',borderRight:i<2?'1px solid '+C.border:'none',padding:'0 6px'}}>
          <div style=${{fontSize:'19px',fontWeight:900,color:s[2]}}>${s[1]}</div>
          ${i===2&&diffP!==null&&html`<div style=${{fontSize:'9px',color:s[2],fontWeight:700}}>${(diff>0?'+':'')+diffP}%</div>`}
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',textTransform:'uppercase',marginTop:'2px'}}>${s[0]}</div>
        </div>`)}
    </div>`}

    ${pickDay&&html`<${WorkoutPicker}
      onSelect=${wkDay=>confirmCheckin(pickDay.k,pickDay.d,wkDay)}
      onClose=${()=>setPickDay(null)}/>`}
  </div>`;}

/* ── TAB PESO ── */
function MetaPeso({ws}){
  const [mt,setMt]=useState(()=>getMetas());
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState('');
  const cur=ws.length?ws[ws.length-1].kg:null;
  if(cur==null)return null;
  const start=mt.startKg!=null?mt.startKg:ws[0].kg;

  const openEdit=()=>{setVal(mt.targetKg!=null?String(mt.targetKg):'');setEditing(true);};
  const saveTarget=()=>{
    const n=Number(String(val).replace(',','.'));
    if(!n||n<=0){setEditing(false);return;}
    const next=Object.assign({},mt,{targetKg:f2(n)});
    ls.s('metas',next);setMt(next);setEditing(false);
  };

  if(!mt.targetKg&&!editing){
    return html`<div style=${{background:C.s1,borderRadius:'13px',padding:'13px',marginBottom:'10px',
      border:'1px dashed '+C.border,display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:'7px'}}>
        <${Ic} n="target" size=${14} col=${C.muted}/>
        <span style=${{fontSize:'11px',color:C.muted}}>Nenhuma meta de peso definida</span>
      </div>
      <button onClick=${openEdit} style=${{padding:'7px 12px',background:C.accent+'18',border:'1px solid '+C.accent+'44',
        borderRadius:'7px',color:C.accent,fontSize:'10px',fontWeight:700,cursor:'pointer'}}>Definir</button>
    </div>`;
  }

  if(editing){
    return html`<div style=${{background:C.s1,borderRadius:'13px',padding:'13px',marginBottom:'10px',border:'1px solid '+C.accent+'55'}}>
      <div style=${{fontSize:'9px',color:C.muted,letterSpacing:'2px',textTransform:'uppercase',marginBottom:'8px',
        display:'flex',alignItems:'center',gap:'6px'}}>
        <${Ic} n="target" size=${12} col=${C.muted}/>Editar meta de peso</div>
      <div style=${{display:'flex',gap:'7px'}}>
        <input type="number" step="0.1" autofocus value=${val} onInput=${e=>setVal(e.target.value)}
          onKeyDown=${e=>e.key==='Enter'&&saveTarget()} placeholder="Ex: 80"
          style=${{flex:1,padding:'9px 11px',background:C.bg,border:'1px solid '+C.border,borderRadius:'8px',
            color:C.text,fontSize:'14px',fontWeight:700,outline:'none'}}/>
        <span style=${{display:'flex',alignItems:'center',color:C.muted,fontSize:'11px'}}>kg</span>
        <button onClick=${saveTarget} style=${{padding:'9px 14px',background:C.accent,border:'none',borderRadius:'8px',
          color:'#fff',fontSize:'11px',fontWeight:700,cursor:'pointer'}}>Salvar</button>
        <button onClick=${()=>setEditing(false)} style=${{padding:'9px 12px',background:'none',border:'1px solid '+C.border,
          borderRadius:'8px',color:C.muted,fontSize:'11px',cursor:'pointer'}}>×</button>
      </div>
    </div>`;
  }

  const total=mt.targetKg-start,done=cur-start;
  const pct=total!==0?Math.max(0,Math.min(100,(done/total)*100)):0;
  const falta=f2(mt.targetKg-cur);
  const alvo=Number(mt.weeklyKg)||0;
  const real=realWeeklyRate(28);
  const semanas=alvo!==0&&falta/alvo>0?Math.ceil(falta/alvo):null;
  const semanasReal=real&&real!==0&&falta/real>0?Math.ceil(falta/real):null;
  const ok=real!=null&&alvo!==0?(alvo>0?real>=alvo*0.7:real<=alvo*0.7):null;
  const rc=ok===null?C.muted:ok?C.ok:C.amber;

function Peso(){

    if(!d.length){setRemind(true);return;}
    const last=new Date(d[d.length-1].date+'T12:00:00');setRemind((new Date()-last)/86400000>=7);},[]);

      <${Ic} n="bell" size=${20} col=${C.blue}/>
      <div><div style=${{fontSize:'11px',fontWeight:700,color:C.blue}}>Hora de pesar!</div>
        <div style=${{fontSize:'10px',color:C.muted}}>${ws.length===0?'Registre seu primeiro peso':'Mais de 7 dias sem registro'}</div></div>

    <${MetaPeso} ws=${ws}/>
    <div style=${{background:C.s1,borderRadius:'13px',padding:'13px',marginBottom:'10px',border:'1px solid '+C.border}}>
      <div style=${{fontSize:'9px',color:C.muted,letterSpacing:'2px',textTransform:'uppercase',marginBottom:'8px'}}>Registrar peso</div>
      <div style=${{display:'flex',gap:'7px'}}>
        <input value=${inp} onInput=${e=>setInp(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&add()}

          style=${{flex:1,padding:'9px 11px',background:C.bg,border:'1px solid '+C.border,borderRadius:'8px',
            color:C.text,fontSize:'14px',fontWeight:700,outline:'none'}}/>
        <span style=${{display:'flex',alignItems:'center',color:C.muted,fontSize:'11px'}}>kg</span>
        <button onClick=${add} style=${{padding:'9px 14px',background:C.accent,border:'none',borderRadius:'8px',
          color:'#fff',fontSize:'11px',fontWeight:700,cursor:'pointer'}}>Salvar</button>
      </div>
    </div>
    ${ws.length>0&&html`<div>
      <div style=${{background:C.s1,borderRadius:'13px',padding:'13px',marginBottom:'10px',border:'1px solid '+C.border}}>
        <div style=${{display:'flex',marginBottom:'13px'}}>
          ${[['Atual',last?last.toFixed(1)+'kg':'-',C.accent],['Início',first?first.toFixed(1)+'kg':'-',C.muted],
            ['Variação',delta===null?'-':(delta>0?'+':'')+delta.toFixed(2)+'kg',
              delta===null?C.muted:delta<0?C.ok:delta>0?C.red:C.muted]].map((s,i)=>
            html`<div key=${i} style=${{flex:1,textAlign:'center',borderRight:i<2?'1px solid '+C.border:'none',padding:'0 6px'}}>
              <div style=${{fontSize:'16px',fontWeight:900,color:s[2]}}>${s[1]}</div>
              <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1px',textTransform:'uppercase',marginTop:'2px'}}>${s[0]}</div>

        ${ws.length>=2&&html`<${WChart} data=${ws.slice(-10)}/>`}
      </div>

        <div style=${{fontSize:'9px',color:C.muted,letterSpacing:'2px',textTransform:'uppercase',marginBottom:'9px'}}>Histórico</div>
        ${ws.slice().reverse().slice(0,12).map((w,i,arr)=>{const prev=arr[i+1],d=prev?f2(w.kg-prev.kg):null;
          return html`<div key=${w.date} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',

              ${d!==null&&html`<span style=${{fontSize:'10px',marginLeft:'6px',color:d<0?C.ok:d>0?C.red:C.muted}}>${d>0?'+':''}${d.toFixed(2)}kg</span>`}

/* ── TAB MACROS ── */
function Macros(){
  const [stab,setStab]=useState('hoje');
  const [meals,setMeals]=useState([]);
  const [hist,setHist]=useState([]);
  const [addCtx,setAddCtx]=useState(null); // null=fechado, ''=genérico, 'Nome'=refeição travada
  const [editMeal,setEditMeal]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [expMeals,setExpMeals]=useState([]);
  const [histEditMeal,setHistEditMeal]=useState(null);
  const [period,setPeriod]=useState('diario');
  const k=tkey(0);

  // Sábado/domingo são dias off: se não houver refeições registradas, pré-preenche com a
  // média dos últimos 5 dias com registro real (ignora dias já estimados, evita "arrastar" a média).
  // Roda também retroativamente para os últimos 7 dias — cobre finais de semana esquecidos.
  const avgOfLastRealDays=(fromOffset,n)=>{
    const days=[];let i=fromOffset;
    while(days.length<n&&i<fromOffset+30){
      const dd=ls.g(tkey(i));
      if(dd&&dd.meals&&dd.meals.length>0&&!dd.autoFillDone)days.push(sumM(dd.meals));
      i++;
    }
    if(!days.length)return null;
    const t=days.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
    return{k:t.k/days.length,p:t.p/days.length,c:t.c/days.length,f:t.f/days.length};
  };
  const backfillWeekends=()=>{
    for(let i=0;i<=6;i++){
      const dk=tkey(i),d=ls.g(dk)||{},curMeals=d.meals||[];
      if(!isWeekend(offsetDate(i))||curMeals.length>0||d.autoFillDone)continue;
      const avg=avgOfLastRealDays(i+1,5);
      if(avg){
        const estMeal={id:Date.now()+i,name:'Dia de descanso (estimado · média 5 dias)',
          k:Math.round(avg.k),p:f2(avg.p),c:f2(avg.c),f:f2(avg.f),estimated:true};
        ls.s(dk,{meals:[estMeal],autoFillDone:true});
      } else {
        ls.s(dk,{meals:curMeals,autoFillDone:true});
      }
    }
  };

  useEffect(()=>{
    backfillWeekends();
    const d=ls.g(k);setMeals(d?d.meals||[]:[]);
    setHist(Array.from({length:6},(_,i)=>{const dk=tkey(i+1),dd=ls.g(dk),m=dd?dd.meals||[]:[];
      return Object.assign({key:dk,count:m.length},sumM(m));}));
  },[]);

  const save=up=>{const cur=ls.g(k)||{};setMeals(up);ls.s(k,{meals:up,autoFillDone:cur.autoFillDone||false});};
  const totals=sumM(meals);
  const goals=ls.g('goals')||GOALS;
  const mgOn=mealGoalsOn(),mDist=getMealDist();
  const mealGoalK=nm=>mgOn&&Number(mDist[nm])>0?Math.round(goals.kcal*Number(mDist[nm])/100):null;
  const pendentes=mgOn?MEAL_OPTIONS.filter(m=>m!=='Outro'&&Number(mDist[m])>0&&CORE4.indexOf(m)<0&&!meals.some(x=>x.name===m)):[];
  const core4Totals=CORE4.map(m=>{
    const ms=meals.filter(x=>x.name===m);
    return{name:m,k:ms.reduce((a,x)=>a+x.k,0),logged:ms.length>0,goalK:mealGoalK(m)};
  });

  // Repetir alimentação de ontem: copia todas as refeições do dia anterior para hoje
  const yData=ls.g(tkey(1));
  const yMeals=yData&&yData.meals?yData.meals:[];
  const repeatYesterday=()=>{
    if(!yMeals.length)return;
    if(meals.length>0&&!confirm('Isso vai adicionar '+yMeals.length+' refeição'+(yMeals.length!==1?'ões':'')+' de ontem às já registradas hoje. Continuar?'))return;
    const copied=yMeals.map((m,i)=>({...m,id:Date.now()+i}));
    save([...meals,...copied]);
  };

  // Edição retroativa: expande um dia do histórico para ver/editar/adicionar refeições esquecidas
  const toggleDay=dk=>{
    if(expanded===dk){setExpanded(null);return;}
    setExpanded(dk);
    const d=ls.g(dk);setExpMeals(d?d.meals||[]:[]);
  };
  const saveExp=up=>{
    const cur=ls.g(expanded)||{};
    setExpMeals(up);ls.s(expanded,{meals:up,autoFillDone:cur.autoFillDone||false});
    setHist(h=>h.map(d=>d.key===expanded?Object.assign({key:d.key,count:up.length},sumM(up)):d));
  };

  // Semanal: blocos rolantes de 7 dias (últimas 6 semanas), média apenas dos dias com registro
  const weeklyData=(()=>{
    const weeks=[];
    for(let w=0;w<6;w++){
      const startOffset=1+w*7,endOffset=startOffset+6;
      let totalK=0,totalP=0,totalC=0,totalF=0,daysLogged=0;
      for(let i=startOffset;i<=endOffset;i++){
        const dd=ls.g(tkey(i));
        if(dd&&dd.meals&&dd.meals.length>0){const s=sumM(dd.meals);totalK+=s.k;totalP+=s.p;totalC+=s.c;totalF+=s.f;daysLogged++;}
      }
      const dOld=new Date(offsetDate(endOffset)+'T12:00:00'),dNew=new Date(offsetDate(startOffset)+'T12:00:00');
      const label=dOld.getDate()+' a '+dNew.getDate()+' de '+MO_ABBR[dNew.getMonth()]+'.';
      weeks.push({label,daysLogged,avgK:daysLogged?totalK/daysLogged:0,avgP:daysLogged?totalP/daysLogged:0,
        avgC:daysLogged?totalC/daysLogged:0,avgF:daysLogged?totalF/daysLogged:0});
    }
    return weeks;
  })();

  // Mensal: agregados por mês-calendário (últimos 6 meses)
  const monthlyData=(()=>{
    const arr=[],now=new Date();
    for(let m=0;m<6;m++){
      const d=new Date(now.getFullYear(),now.getMonth()-m,1),y=d.getFullYear(),mo=d.getMonth();
      const daysInMonth=new Date(y,mo+1,0).getDate();
      let totalK=0,totalP=0,totalC=0,totalF=0,daysLogged=0;
      for(let day=1;day<=daysInMonth;day++){
        const dateStr=y+'-'+pad(mo+1)+'-'+pad(day);
        if(new Date(dateStr+'T00:00:00')>now)continue;
        const dd=ls.g('tk:'+dateStr);
        if(dd&&dd.meals&&dd.meals.length>0){const s=sumM(dd.meals);totalK+=s.k;totalP+=s.p;totalC+=s.c;totalF+=s.f;daysLogged++;}
      }
      arr.push({y,mo,daysInMonth,daysLogged,avgK:daysLogged?totalK/daysLogged:0,avgP:daysLogged?totalP/daysLogged:0,
        avgC:daysLogged?totalC/daysLogged:0,avgF:daysLogged?totalF/daysLogged:0});
    }
    return arr;
  })();

  return html`<div style=${{padding:'0 14px 20px'}}>
    <div style=${{display:'flex',gap:'4px',background:C.s1,borderRadius:'9px',padding:'3px',marginBottom:'10px'}}>
      ${[['hoje','Hoje'],['historico','Histórico']].map(t=>
        html`<button key=${t[0]} onClick=${()=>setStab(t[0])} style=${{flex:1,padding:'7px 0',border:'none',borderRadius:'6px',
          cursor:'pointer',fontSize:'11px',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',
          background:stab===t[0]?C.accent:'transparent',color:stab===t[0]?'#fff':C.muted}}>${t[1]}</button>`)}
    </div>

    ${stab==='hoje'&&html`<div>
      <div style=${{marginBottom:'10px'}}>
        <div style=${{fontSize:'9px',color:C.muted,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:'6px',padding:'0 2px'}}>Refeições</div>
        ${core4Totals.map(c=>html`<div key=${c.name} onClick=${()=>setAddCtx(c.name)} style=${{background:C.s1,
          borderRadius:'12px',padding:'12px 13px',marginBottom:'7px',border:'1px solid '+C.border,
          cursor:'pointer',display:'flex',alignItems:'center',gap:'10px',minHeight:'54px'}}>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontSize:'14px',fontWeight:700}}>${c.name}</div>
            <div style=${{fontSize:'11px',color:c.logged?C.accent:C.muted,marginTop:'2px'}}>
              ${c.logged?c.k+' kcal':'0 kcal'}${c.goalK?' · meta '+c.goalK+' kcal':''}</div>
          </div>
          <button onClick=${e=>{e.stopPropagation();setAddCtx(c.name);}} style=${{background:C.accent+'18',
            border:'none',borderRadius:'50%',width:'34px',height:'34px',flexShrink:0,cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center'}}>
            <${Ic} n="plus" size=${17} col=${C.accent}/></button>
        </div>`)}
      </div>

      <div style=${{background:C.s1,borderRadius:'13px',padding:'14px',marginBottom:'10px',border:'1px solid '+C.border}}>
        <div style=${{display:'flex',alignItems:'center',gap:'12px'}}>
          <${ArcGauge} val=${totals.k} goal=${goals.kcal}/>
          <div style=${{flex:1}}>
            <${Bar} label="Proteína" val=${totals.p} goal=${goals.protein} unit="g" color=${C.blue}/>
            <${Bar} label="Carboidratos" val=${totals.c} goal=${goals.carbs} unit="g" color=${C.purple}/>
            <${Bar} label="Gordura" val=${totals.f} goal=${goals.fat} unit="g" color=${C.amber}/>
          </div>
        </div>
        ${pendentes.length>0&&html`<div style=${{marginTop:'11px',paddingTop:'9px',borderTop:'1px solid '+C.border}}>
          <div style=${{fontSize:'8px',color:C.muted,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:'5px'}}>Outras refeições pendentes</div>
          <div style=${{display:'flex',flexWrap:'wrap',gap:'5px'}}>

        justifyContent:'center',gap:'7px',letterSpacing:'.3px'}}>

            ${m.estimated&&html`<span style=${{fontSize:'7px',fontWeight:700,color:C.amber,background:C.amber+'18',

const normalizeMealItems=meal=>{
  if(Array.isArray(meal.items)&&meal.items.length&&typeof meal.items[0]==='object'&&meal.items[0]!==null&&'k' in meal.items[0]){
    return meal.items.map((it,i)=>({...it,id:it.id||('it_'+i)}));
  }
  return [{id:'legacy_0',food:meal.name||'Item',qty:null,unit:null,k:meal.k||0,p:meal.p||0,c:meal.c||0,f:meal.f||0,_legacy:true}];
};
